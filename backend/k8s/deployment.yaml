apiVersion: apps/v1
kind: Deployment
metadata:
  name: finadvisor-web
  namespace: finadvisor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finadvisor-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: finadvisor-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          image: your-registry/your-image@sha256:REPLACE_DIGEST
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: finadvisor-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
