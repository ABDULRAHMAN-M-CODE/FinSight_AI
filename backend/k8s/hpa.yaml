apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finadvisor-web-hpa
  namespace: finadvisor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finadvisor-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
